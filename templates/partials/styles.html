{# The single design system for every SprintZero screen.
   Extracted from index.html when the landing screen arrived, so the two
   cannot drift into different palettes. The two-axis status grammar in
   :root is load-bearing — see the comment there before changing colours. #}
    <style>
        /* ==================== RESET + ROOT ==================== */
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            color: #1A2332;
            line-height: 1.5;
            background: #F7F9FC;
            font-feature-settings: "cv11", "ss01", "ss03";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        code { background: #F0F3F8; padding: 1px 6px; border-radius: 4px; font-size: 12.5px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

        :root {
            /* Brand */
            --navy-900: #0F1F3A;
            --navy-700: #1B3A5C;
            --navy-500: #2E6DA4;
            --navy-300: #60A5FA;
            --navy-100: #DBEAFE;
            /* Agent 2 */
            --violet-700: #5B3FB3;
            --violet-500: #7C5CD3;
            --violet-100: #EFE7FC;
            /* Status */
            --green-700: #1E7A47;
            --green-500: #276B47;
            --green-100: #DDF0E4;
            --amber-700: #8B5A00;
            --amber-500: #B07800;
            --amber-100: #FFEFC9;
            --red-700: #A01F1F;
            --red-500: #B04040;
            --red-100: #FCDFDF;
            /* ============================================================
               TWO-AXIS STATUS GRAMMAR  (SprintZero design rule)

               These are two INDEPENDENT axes. Do not merge them, and do not
               reuse one axis's tokens for the other. Conflating them is what
               made a WEAK verdict read as a failure, which is wrong: weak
               evidence surfaced by the QA layer is the system working.

               AXIS 1 - EVIDENCE STRENGTH (strong / uncertain / weak)
                 A measurement, not a judgement. Rendered on a NEUTRAL slate
                 ramp that varies by DEPTH OF INK, never by hue. Strong = dense
                 and dark (more signal). Weak = faint (less signal). No red,
                 no green, ever.

               AXIS 2 - QA STATUS (passed / failed)
                 A gate decision, and the ONLY axis permitted semantic colour.
                 Green and red belong here and nowhere else in the pane.

               AXIS 3 is not a status axis: --attention-* is advisory chrome
               for gap flags, which are neither an evidence measurement nor a
               QA decision.
               ============================================================ */

            /* AXIS 1 - Evidence strength. NEUTRAL. Never semantic. */
            --strength-strong-bg-a: #E9EEF4;
            --strength-strong-bg-b: #DCE4EE;
            --strength-strong-ink: #0F172A;
            --strength-strong-fill: #1B3A5C;
            --strength-moderate-bg-a: #F1F4F8;
            --strength-moderate-bg-b: #E7ECF3;
            --strength-moderate-ink: #475467;
            --strength-moderate-fill: #6B7280;
            --strength-weak-bg-a: #F8FAFC;
            --strength-weak-bg-b: #F1F4F8;
            --strength-weak-ink: #5C6573;
            --strength-weak-fill: #B0B7C2;

            /* AXIS 2 - QA status. SEMANTIC. Reserved for the gate. */
            --qa-pass-bg-a: #F0F7F2;
            --qa-pass-bg-b: #E5F2EA;
            --qa-pass-ink: #1E7A47;
            --qa-pass-soft: #DDF0E4;
            --qa-fail-bg-a: #FEF2F2;
            --qa-fail-bg-b: #FCDFDF;
            --qa-fail-ink: #A01F1F;
            --qa-fail-soft: #FCDFDF;
            --qa-fail-rule: #E8A0A0;
            /* Degraded failure: QA blocked the verdict but gave no reason.
               Must NOT look like a substantive failure. */
            --qa-degraded-bg-a: #F6F7F9;
            --qa-degraded-bg-b: #EDEFF3;
            --qa-degraded-ink: #5C6573;
            --qa-note-soft: #FFEFC9;
            --qa-note-ink: #8B5A00;

            /* Advisory chrome - gap flags. Neither status axis. */
            --attention-bg-a: #FFFAEB;
            --attention-bg-b: #FFF5D9;
            --attention-line: #F5DDA0;
            --attention-ink: #8B5A00;
            --attention-ink-soft: #B07800;

            /* Neutrals */
            --ink-900: #0F172A;
            --ink-800: #1A2332;
            --ink-600: #475467;
            --ink-500: #5C6573;
            --ink-400: #8B919D;
            --ink-300: #B0B7C2;
            --line-200: #EAECEF;
            --line-100: #EEF1F5;
            --bg-100: #F7F9FC;
            --bg-50: #FAFBFD;
            /* Elevation */
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.06), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
            /* Geometry */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 10px;
            --radius-xl: 14px;
            --radius-full: 999px;
        }

        /* ==================== LAYOUT ==================== */
        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* ==================== LEFT (CHAT) PANE ==================== */
        .chat-pane {
            width: 33.33%; min-width: 380px; max-width: 520px;
            background: white; border-right: 1px solid var(--line-200);
            display: flex; flex-direction: column;
        }

        /* Project header — refined SaaS topbar */
        .project-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--line-200);
            background: var(--navy-700);
            background-image: linear-gradient(135deg, #1B3A5C 0%, #0F1F3A 100%);
            color: white;
            font-size: 13px;
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .project-header .logo {
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            filter: drop-shadow(0 1px 3px rgba(59, 130, 246, 0.35));
        }
        .project-header .brand {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.01em;
            color: white;
            margin-right: auto;
        }
        .project-header .project-divider {
            width: 1px; height: 18px; background: rgba(255,255,255,0.18);
        }
        .project-header .project-info {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px;
        }
        .project-header .project-label {
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 10px;
            font-weight: 600;
        }
        .project-header .project-name { font-weight: 600; }
        .project-header .brand-link { text-decoration: none; transition: opacity 0.15s; }
        .project-header .brand-link:hover { opacity: 0.75; }
        .project-header .project-setup {
            font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; padding: 2px 8px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.16); color: #FFE7B0;
        }
        .project-header .project-tick {
            color: #6EE7B7;
            font-size: 11px;
        }

        /* Knowledge base card */
        .kb-card {
            padding: 12px 18px;
            background: linear-gradient(180deg, #F4FAF6 0%, #EAF5EE 100%);
            border-bottom: 1px solid var(--line-200);
            flex-shrink: 0;
        }
        .kb-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            font-weight: 700; color: var(--green-500); margin-bottom: 6px;
        }
        .kb-list { margin: 0; padding: 0; list-style: none; font-size: 13px; }
        .kb-list li {
            display: flex; gap: 6px; align-items: baseline;
            margin-bottom: 3px; color: var(--ink-600);
        }
        .kb-list li::before {
            content: ""; display: inline-block;
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--green-500);
            flex-shrink: 0; transform: translateY(-2px);
        }
        .kb-list strong { color: var(--navy-700); font-weight: 600; }

        /* ---------- Reference data management ---------- */
        .ref-total {
            margin-top: 9px; padding-top: 9px;
            border-top: 1px solid var(--line-100);
            font-size: 11.5px; color: var(--ink-500);
        }
        .ref-manage { margin-top: 10px; }
        .ref-manage > summary {
            cursor: pointer; list-style: none; user-select: none;
            font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--navy-500);
        }
        .ref-manage > summary::-webkit-details-marker { display: none; }
        .ref-manage > summary::before { content: "▸ "; }
        .ref-manage[open] > summary::before { content: "▾ "; }
        .ref-manage > summary:hover { color: var(--navy-700); }

        .ref-error {
            margin: 10px 0; padding: 9px 11px; font-size: 12.5px; line-height: 1.5;
            background: var(--qa-fail-bg-a); border: 1px solid var(--qa-fail-rule);
            border-radius: var(--radius-sm); color: var(--qa-fail-ink);
        }
        .ref-empty {
            margin: 10px 0; font-size: 12.5px; color: var(--ink-500); line-height: 1.5;
        }
        .ref-list { list-style: none; margin: 10px 0 0 0; padding: 0; }
        .ref-item {
            padding: 9px 0; border-bottom: 1px solid var(--line-100);
            display: grid; grid-template-columns: 1fr auto;
            grid-template-areas: "main action" "meta action";
            align-items: center; gap: 0 10px;
        }
        .ref-item:last-child { border-bottom: 0; }
        .ref-item-main { grid-area: main; display: flex; align-items: baseline; gap: 7px; }
        .ref-item-meta { grid-area: meta; font-size: 11px; color: var(--ink-400); margin-top: 2px; }
        .ref-item form { grid-area: action; }
        .ref-id {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 10.5px; font-weight: 700; color: var(--navy-500);
            background: var(--navy-100); padding: 1px 5px; border-radius: 3px;
        }
        .ref-title { font-size: 12.5px; font-weight: 600; color: var(--ink-800); }
        .ref-remove {
            font-family: inherit; font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em;
            padding: 4px 9px; cursor: pointer;
            background: white; color: var(--ink-500);
            border: 1px solid var(--line-200); border-radius: var(--radius-sm);
            transition: color 0.15s, border-color 0.15s;
        }
        .ref-remove:hover { color: var(--qa-fail-ink); border-color: var(--qa-fail-rule); }

        .ref-add { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-200); }
        .ref-field { margin-bottom: 10px; }
        .ref-field label {
            display: block; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--ink-500); margin-bottom: 4px;
        }
        .ref-field input[type="text"], .ref-field textarea, .ref-field select {
            width: 100%; font-family: inherit; font-size: 12.5px; color: var(--ink-900);
            padding: 7px 9px; background: white;
            border: 1px solid var(--line-200); border-radius: var(--radius-sm);
        }
        .ref-field textarea { resize: vertical; line-height: 1.5; }
        .ref-field input:focus, .ref-field textarea:focus, .ref-field select:focus {
            outline: none; border-color: var(--navy-300);
        }
        .ref-field input[type="file"] { font-size: 11.5px; color: var(--ink-600); }
        .ref-help { font-size: 11px; color: var(--ink-400); margin-top: 4px; }
        .ref-submit {
            font-family: inherit; font-size: 12px; font-weight: 700;
            padding: 8px 14px; border: 0; border-radius: var(--radius-sm);
            background: var(--navy-700); color: white; cursor: pointer;
        }
        .ref-submit:hover { background: var(--navy-900); }

        /* Chat trail */
        .chat-trail { flex: 1; overflow-y: auto; padding: 18px 18px 8px 18px; }
        .chat-trail-initial {
            color: var(--ink-400); font-size: 13px;
            text-align: center; margin-top: 32px; padding: 0 20px;
            line-height: 1.6;
        }

        .chat-turn { margin-bottom: 22px; }
        .chat-turn:last-child { margin-bottom: 12px; }

        /* User query bubble */
        .query-bubble {
            background: linear-gradient(135deg, #2E6DA4 0%, #1B3A5C 100%);
            color: white;
            padding: 10px 14px;
            border-radius: 14px 14px 4px 14px;
            max-width: 88%;
            margin: 0 0 10px auto;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.1);
        }

        /* Activity log (live + collapsed) */
        .activity-log {
            background: var(--bg-50);
            border: 1px solid var(--line-200);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            transition: border-color 0.15s;
        }
        .activity-log[open] { border-color: #D0D7DE; }
        .activity-log > summary {
            padding: 10px 14px; cursor: pointer; list-style: none;
            font-size: 12px; color: var(--ink-500); user-select: none;
            display: flex; align-items: center; gap: 8px;
            font-weight: 500;
        }
        .activity-log > summary::-webkit-details-marker { display: none; }
        .activity-log > summary::before {
            content: ""; display: inline-block;
            width: 0; height: 0;
            border-left: 5px solid var(--ink-400);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform 0.15s;
        }
        .activity-log[open] > summary::before { transform: rotate(90deg); }
        .activity-log[open] > summary { border-bottom: 1px solid var(--line-100); }
        .activity-entries { list-style: none; margin: 0; padding: 8px 14px 10px 14px; font-size: 12px; color: var(--ink-600); }
        .activity-entry {
            padding: 5px 0 5px 22px; position: relative;
            opacity: 0; animation: fadein 0.3s forwards;
            line-height: 1.45;
        }
        .activity-entry::before {
            content: ""; position: absolute; left: 5px; top: 11px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--ink-300);
            box-shadow: 0 0 0 2px var(--bg-50);
            z-index: 1;
        }
        /* Vertical connector line linking each step to the next. */
        .activity-entry::after {
            content: ""; position: absolute;
            left: 8px;
            top: 19px;
            bottom: -11px;
            width: 2px;
            background: var(--line-200);
            z-index: 0;
        }
        .activity-entry:last-child::after { display: none; }
        .activity-entry.done::before { background: var(--green-500); }
        .activity-entry.handoff::before { background: var(--violet-500); }
        .activity-entry.final::before { background: var(--navy-700); }
        @keyframes fadein { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }

        /* Conversational system messages */
        .sys-msg {
            background: white;
            border: 1px solid var(--line-200);
            border-left: 3px solid var(--navy-500);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            margin-bottom: 8px;
            font-size: 13px;
            box-shadow: var(--shadow-sm);
        }
        .sys-msg-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-500); margin-bottom: 4px; font-weight: 700; }
        .sys-msg-body { color: var(--ink-800); white-space: pre-wrap; line-height: 1.5; }
        .sys-msg-challenge { border-left-color: var(--amber-500); background: #FFFAEB; }
        .sys-msg-challenge .sys-msg-label { color: var(--amber-700); }
        .sys-msg-required { border-left-color: var(--amber-500); }
        .sys-msg-required .sys-msg-label { color: var(--amber-700); }
        .sys-msg-options { border-left-color: var(--green-500); }
        .sys-msg-options .sys-msg-label { color: var(--green-500); }
        .sys-msg-tacit { border-left-color: var(--violet-500); background: #F8F4FF; }
        .sys-msg-tacit .sys-msg-label { color: var(--violet-700); }
        .sys-msg-error { border-left-color: var(--red-500); background: #FEF2F2; }
        .sys-msg-error .sys-msg-label { color: var(--red-700); }
        .sys-msg-done {
            font-size: 12px; color: var(--ink-500);
            padding: 6px 14px;
            background: none; border: none;
            box-shadow: none;
        }
        .sys-msg-done-arrow { color: var(--green-500); font-weight: 700; margin-right: 6px; }
        .sys-msg-detail { margin-top: 8px; font-size: 12px; }
        .sys-msg-detail summary { cursor: pointer; color: var(--ink-500); user-select: none; }
        .sys-msg-detail > div { padding-top: 6px; color: var(--ink-500); }

        /* Theme hint above textarea */
        .theme-hint { margin: 0 18px 8px 18px; font-size: 12px; }
        .theme-hint > summary {
            cursor: pointer; color: var(--navy-500);
            user-select: none; list-style: none;
            padding: 4px 0;
            display: inline-flex; align-items: center; gap: 6px;
            font-weight: 500;
        }
        .theme-hint > summary::-webkit-details-marker { display: none; }
        .theme-hint > summary::before {
            content: "?";
            display: inline-flex;
            width: 16px; height: 16px;
            background: var(--navy-100);
            color: var(--navy-500);
            border-radius: 50%;
            font-weight: 800; font-size: 11px;
            align-items: center; justify-content: center;
            flex-shrink: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .theme-hint-body {
            background: linear-gradient(180deg, #F0F7FA 0%, #E6F0F5 100%);
            border: 1px solid #D6E8F0;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: var(--ink-600);
            margin-top: 6px; line-height: 1.55;
        }
        .theme-hint-body ul { margin: 6px 0; padding-left: 18px; }
        .theme-hint-body em { color: var(--navy-700); font-style: italic; }

        /* Sticky textarea */
        .chat-input-area {
            flex-shrink: 0; padding: 8px 18px 18px 18px;
            background: white; border-top: 1px solid var(--line-200);
        }
        .chat-input-inner {
            display: flex; gap: 6px; align-items: flex-end;
            background: white;
            border: 1.5px solid #D9DFE6;
            border-radius: var(--radius-xl);
            padding: 7px 7px 7px 14px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .chat-input-inner:focus-within {
            border-color: var(--navy-500);
            box-shadow: 0 0 0 3px rgba(46, 109, 164, 0.12), var(--shadow-sm);
        }
        .chat-input-inner textarea {
            flex: 1; border: 0; outline: none; resize: none;
            font-family: inherit; font-size: 14px;
            min-height: 22px; max-height: 180px;
            padding: 5px 0; line-height: 1.45;
            color: var(--ink-800); background: transparent;
        }
        .chat-input-inner textarea::placeholder { color: var(--ink-400); }
        .send-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--navy-500);
            color: white; border: 0; cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
            box-shadow: 0 1px 2px rgba(46, 109, 164, 0.25);
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .send-btn svg { display: block; }
        .send-btn:hover:not(:disabled) {
            background: var(--navy-700);
            box-shadow: 0 2px 5px rgba(46, 109, 164, 0.35);
            transform: translateY(-1px);
        }
        .send-btn:active:not(:disabled) { transform: translateY(0); }
        .send-btn:disabled { background: #B0BAC5; cursor: not-allowed; box-shadow: none; }

        /* ==================== RIGHT (OUTPUT) PANE ==================== */
        .right-pane { flex: 1; overflow-y: auto; padding: 28px 36px; background: var(--bg-100); }

        /* Empty / initial states */
        .empty-pane {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 80%; color: var(--ink-400);
            text-align: center; padding: 40px;
        }
        .empty-pane-logo {
            margin-bottom: 18px;
            opacity: 0.5;
        }
        .empty-pane-glyph { font-size: 40px; color: #C9D2DC; margin-bottom: 12px; }
        .empty-pane-text { font-size: 15px; color: var(--ink-500); font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
        .empty-pane-sub { font-size: 13px; color: var(--ink-400); line-height: 1.6; max-width: 320px; }

        /* Agent surface */
        /* ==================== TIER 1 — DECISION BAND (WS3) ====================
           Always visible, never collapsed. Carries the QA gate, the verdict,
           and the one signal that most changes what the reader does next. */
        .decision-band {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--line-200);
            margin-bottom: 10px;
            overflow: hidden;
        }

        /* QA status, hoisted out of Agent 2's surface. The schema requires the
           stamp be prominent rather than buried below the evaluation; the full
           Agent 2 surface still lives below the divider. */
        .qa-band {
            display: flex; align-items: center; gap: 9px;
            padding: 10px 22px;
            font-size: 12px;
            border-bottom: 1px solid var(--line-200);
            transition: background 0.25s ease;
        }
        .qa-band-dot {
            width: 7px; height: 7px; border-radius: 50%;
            flex-shrink: 0; background: var(--ink-300);
        }
        .qa-band-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
            font-weight: 700; color: var(--ink-500);
        }
        .qa-band-value { font-weight: 700; letter-spacing: -0.005em; }
        .qa-band-hint {
            margin-left: auto; font-size: 11px; color: var(--ink-400);
            text-align: right;
        }
        .qa-band-pending { background: var(--bg-50); }
        .qa-band-pending .qa-band-dot { animation: qa-band-pulse 1.4s ease-in-out infinite; }
        .qa-band-pending .qa-band-value { color: var(--ink-500); }
        @keyframes qa-band-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        .qa-band-passed { background: linear-gradient(180deg, var(--qa-pass-bg-a) 0%, var(--qa-pass-bg-b) 100%); }
        .qa-band-passed .qa-band-dot { background: var(--qa-pass-ink); }
        .qa-band-passed .qa-band-value { color: var(--qa-pass-ink); }

        .qa-band-failed { background: linear-gradient(180deg, var(--qa-fail-bg-a) 0%, var(--qa-fail-bg-b) 100%); }
        .qa-band-failed .qa-band-dot { background: var(--qa-fail-ink); }
        .qa-band-failed .qa-band-value { color: var(--qa-fail-ink); }

        .qa-band-degraded { background: linear-gradient(180deg, var(--qa-degraded-bg-a) 0%, var(--qa-degraded-bg-b) 100%); }
        .qa-band-degraded .qa-band-dot { background: var(--ink-400); }
        .qa-band-degraded .qa-band-value { color: var(--qa-degraded-ink); }

        .qa-band-unavailable { background: var(--bg-50); }
        .qa-band-unavailable .qa-band-value { color: var(--ink-500); }

        /* The single most load-bearing signal. Sits inside Tier 1 on the pass
           path; on QA_FAILED the gate fragment above it is what matters. */
        .lead-signal {
            padding: 15px 26px 17px 26px;
            border-top: 1px solid var(--line-100);
            background: var(--bg-50);
        }
        .lead-signal-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--ink-500); font-weight: 700; margin-bottom: 6px;
        }
        .lead-signal-body {
            font-size: 13.5px; line-height: 1.6; color: var(--ink-800);
            max-width: 72ch;
        }
        .decision-band.qa-invalidated-parent .lead-signal { opacity: 0.55; }

        /* ==================== TIER 2 — SIGNAL STRIP ====================
           The shape of the evidence in one scannable line. Each chip is a
           jump into its Tier 3 card. */
        .signal-strip {
            display: flex; flex-wrap: wrap; gap: 7px;
            margin: 0 0 14px 0;
        }
        .signal-chip {
            display: inline-flex; align-items: baseline; gap: 6px;
            padding: 7px 12px;
            background: white;
            border: 1px solid var(--line-200);
            border-radius: var(--radius-full);
            font-family: inherit; font-size: 12px;
            color: var(--ink-600);
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        .signal-chip:hover {
            border-color: var(--navy-300);
            box-shadow: var(--shadow-sm);
        }
        .signal-chip:active { transform: translateY(1px); }
        .signal-chip-num { font-weight: 800; font-size: 14px; color: var(--ink-900); }
        .signal-chip-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
            font-weight: 700; color: var(--ink-500);
        }
        .signal-chip-val { font-weight: 700; font-size: 11.5px; color: var(--ink-800); }
        .signal-chip-flag .signal-chip-num { color: var(--attention-ink); }
        .signal-chip-attention {
            background: linear-gradient(180deg, var(--attention-bg-a) 0%, var(--attention-bg-b) 100%);
            border-color: var(--attention-line);
        }
        .signal-chip-attention .signal-chip-num,
        .signal-chip-attention .signal-chip-label { color: var(--attention-ink); }

        /* Momentary highlight when a chip jumps you to its card. */
        @keyframes card-flash {
            0% { box-shadow: 0 0 0 0 rgba(46, 109, 164, 0.35); }
            100% { box-shadow: 0 0 0 7px rgba(46, 109, 164, 0); }
        }
        .spine-card.card-targeted { animation: card-flash 0.85s ease-out; border-color: var(--navy-300); }

        /* ==================== TIER 3 — DEPTH ON DEMAND ====================
           Grouped, not nine peer accordions. */
        .tier3-group { margin-bottom: 16px; }
        .tier3-group:last-child { margin-bottom: 0; }
        .tier3-group-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.11em;
            font-weight: 700; color: var(--ink-400);
            padding: 0 4px 7px 4px;
        }

        .agent-surface {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 6px;
            overflow: hidden;
            border: 1px solid var(--line-200);
        }
        .agent-banner {
            padding: 11px 22px;
            display: flex; align-items: baseline; gap: 12px;
            border-bottom: 1px solid var(--line-200);
        }
        .agent-name {
            font-weight: 700; font-size: 13px;
            letter-spacing: -0.005em;
        }
        .agent-role {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--ink-400);
            font-weight: 600;
        }
        .agent1-banner { background: linear-gradient(180deg, #F5F9FD 0%, #EBF2FA 100%); }
        .agent1-banner .agent-name { color: var(--navy-700); }
        .agent1-banner .agent-name::before {
            content: ""; display: inline-block; vertical-align: middle;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--navy-500);
            margin-right: 8px;
            box-shadow: 0 0 0 3px rgba(46, 109, 164, 0.15);
        }
        .agent2-banner { background: linear-gradient(180deg, #FAF6FF 0%, #F3EBFF 100%); }
        .agent2-banner .agent-name { color: var(--violet-700); }
        .agent2-banner .agent-name::before {
            content: ""; display: inline-block; vertical-align: middle;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--violet-500);
            margin-right: 8px;
            box-shadow: 0 0 0 3px rgba(124, 92, 211, 0.18);
        }

        /* Verdict banner inside Agent 1 surface */
        .verdict-banner {
            padding: 22px 26px;
            border-bottom: 1px solid var(--line-200);
        }
        /* AXIS 1 - evidence strength. Neutral ramp: depth of ink, not hue. */
        .verdict-banner.STRONG { background: linear-gradient(180deg, var(--strength-strong-bg-a) 0%, var(--strength-strong-bg-b) 100%); }
        .verdict-banner.UNCERTAIN { background: linear-gradient(180deg, var(--strength-moderate-bg-a) 0%, var(--strength-moderate-bg-b) 100%); }
        .verdict-banner.WEAK { background: linear-gradient(180deg, var(--strength-weak-bg-a) 0%, var(--strength-weak-bg-b) 100%); }
        .verdict-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--ink-500); font-weight: 700; margin-bottom: 8px;
        }
        .classification {
            font-size: 36px; font-weight: 800;
            letter-spacing: -0.025em; line-height: 1;
        }
        .classification.STRONG { color: var(--strength-strong-ink); font-weight: 800; }
        .classification.UNCERTAIN { color: var(--strength-moderate-ink); font-weight: 750; }
        .classification.WEAK { color: var(--strength-weak-ink); font-weight: 700; }
        .confidence-row {
            display: flex; align-items: center; gap: 12px;
            margin-top: 12px; font-size: 12px; color: var(--ink-500);
            font-weight: 500;
        }
        .confidence-num { white-space: nowrap; }
        .confidence-stab { white-space: nowrap; }
        .confidence-bar {
            flex: 0 1 180px; height: 6px;
            background: rgba(15, 23, 42, 0.07);
            border-radius: var(--radius-full); overflow: hidden;
        }
        .confidence-fill {
            display: block; height: 100%;
            background: var(--navy-500);
            border-radius: var(--radius-full);
            transition: width 0.5s ease;
        }
        .confidence-fill.STRONG { background: var(--strength-strong-fill); }
        .confidence-fill.UNCERTAIN { background: var(--strength-moderate-fill); }
        .confidence-fill.WEAK { background: var(--strength-weak-fill); }
        .verdict-summary { margin-top: 14px; font-size: 14px; color: var(--ink-800); line-height: 1.55; }

        /* Early verdict: real, but the document beneath it is still being
           written. Says so rather than implying the analysis is complete. */
        .verdict-banner-early::after {
            content: "Synthesis continuing — evidence and reasoning still being written";
            display: block;
            margin-top: 13px;
            font-size: 11px;
            font-style: italic;
            color: var(--ink-400);
        }

        /* ---------- QA GATE ACTING ON THE VERDICT (WS1) ----------
           Applied only when /qa returns QA_FAILED. On QA_PASSED none of these
           classes are set and the banner renders exactly as it always has.

           Strikethrough is on the short, decisive tokens - the classification
           word and the numeric confidence. The one-line verdict prose is muted
           rather than struck: line-through across a full sentence costs more
           legibility than it buys signal, and the reader still needs to be able
           to read what was blocked. */
        .verdict-banner.qa-invalidated {
            border-left: 3px solid var(--qa-fail-rule);
            position: relative;
        }
        .verdict-banner.qa-invalidated .classification,
        .verdict-banner.qa-invalidated .confidence-num {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: var(--qa-fail-ink);
            opacity: 0.62;
        }
        .verdict-banner.qa-invalidated .verdict-summary {
            color: var(--ink-500);
            opacity: 0.8;
        }
        .verdict-banner.qa-invalidated .confidence-fill { opacity: 0.35; }

        /* Degraded: blocked, but nothing was actually checked. Neutral, not red -
           it is not a finding, and must not be dressed as one. */
        .verdict-banner.qa-invalidated.qa-degraded { border-left-color: var(--ink-300); }
        .verdict-banner.qa-invalidated.qa-degraded .classification,
        .verdict-banner.qa-invalidated.qa-degraded .confidence-num {
            text-decoration-color: var(--ink-400);
        }

        .verdict-gate {
            margin-top: 16px;
            padding: 13px 15px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--qa-fail-rule);
            border-radius: var(--radius-md);
        }
        .verdict-gate-degraded { border-color: var(--line-200); }
        .verdict-gate-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .verdict-gate-badge {
            flex-shrink: 0;
            font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
            padding: 4px 9px; border-radius: var(--radius-sm);
            background: var(--qa-fail-ink); color: white;
            text-transform: uppercase;
        }
        .verdict-gate-badge-degraded { background: var(--ink-500); }
        .verdict-gate-title {
            font-size: 12px; font-weight: 700; color: var(--ink-800);
            letter-spacing: -0.005em;
        }
        .verdict-gate-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--ink-500); font-weight: 700; margin-bottom: 5px;
        }
        .verdict-gate-body { font-size: 13px; line-height: 1.6; color: var(--ink-800); }
        .verdict-gate-detail { margin-top: 10px; }
        .verdict-gate-detail > summary {
            cursor: pointer; list-style: none;
            font-size: 11px; font-weight: 700; color: var(--ink-500);
            text-transform: uppercase; letter-spacing: 0.06em;
            user-select: none;
        }
        .verdict-gate-detail > summary::-webkit-details-marker { display: none; }
        .verdict-gate-detail > summary::before { content: "▸ "; }
        .verdict-gate-detail[open] > summary::before { content: "▾ "; }
        .verdict-gate-detail > summary:hover { color: var(--ink-800); }
        .verdict-gate-detail-body {
            margin-top: 7px; font-size: 13px; line-height: 1.6;
            color: var(--ink-600); white-space: pre-wrap;
        }

        /* Spine cards */
        .spine { padding: 0; }
        .spine-card {
            background: white;
            border: 1px solid var(--line-200);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            overflow: hidden;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .spine-card:hover { border-color: #D9DFE6; }
        .spine-card[open] { box-shadow: var(--shadow-sm); }
        .spine-card > summary {
            padding: 11px 16px; cursor: pointer; list-style: none;
            display: flex; align-items: center; gap: 12px; user-select: none;
        }
        .spine-card > summary::-webkit-details-marker { display: none; }
        .spine-card > summary::after {
            content: ""; margin-left: auto; flex-shrink: 0;
            width: 0; height: 0;
            border-left: 5px solid var(--ink-300);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform 0.15s;
        }
        .spine-card[open] > summary::after { transform: rotate(90deg); }
        .spine-card > summary:hover { background: var(--bg-50); }
        .card-title {
            font-weight: 600; font-size: 13px;
            color: var(--navy-700); letter-spacing: -0.005em;
        }
        .card-summary { color: var(--ink-400); font-size: 12px; }
        .card-body { padding: 10px 16px 16px 16px; border-top: 1px solid var(--line-100); }
        .field { margin-bottom: 14px; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            font-weight: 700; font-size: 10px;
            color: var(--ink-500); margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .field-value { white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--ink-800); }
        .field-id {
            display: inline-block;
            background: var(--navy-700); color: white;
            font-size: 10px; padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-weight: 600;
            margin-right: 8px;
            vertical-align: baseline;
            letter-spacing: 0.02em;
        }
        .evidence-item { margin-bottom: 8px; font-size: 13px; line-height: 1.55; }

        /* Gap flags card: amber even when collapsed */
        .gap-corpus-required { margin-top: 4px; color: #6B5800; }
        .spine-card-gaps { background: linear-gradient(180deg, var(--attention-bg-a) 0%, var(--attention-bg-b) 100%); border-color: var(--attention-line); }
        .spine-card-gaps:hover { border-color: #ECD080; }
        .spine-card-gaps > summary .card-title { color: var(--attention-ink); }
        .spine-card-gaps > summary .card-summary { color: var(--attention-ink-soft); }
        .spine-card-gaps > summary:hover { background: rgba(255, 239, 201, 0.5); }
        .spine-card-gaps[open] > summary { background: #FFF1D0; }

        /* Agent divider */
        .agent-divider {
            display: flex; align-items: center; gap: 14px;
            margin: 22px 0;
        }
        .agent-divider-line {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--violet-500), transparent);
        }
        .agent-divider-label {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--violet-700);
            font-weight: 700; white-space: nowrap;
        }

        /* Agent 2 surface */
        .agent2-surface { border-top: 3px solid var(--violet-500); }
        .qa-stamp-large { padding: 22px 26px; border-bottom: 1px solid var(--line-200); }
        /* AXIS 2 - QA status. The only axis that may use semantic colour. */
        .qa-stamp-large.QA_PASSED { background: linear-gradient(180deg, var(--qa-pass-bg-a) 0%, var(--qa-pass-bg-b) 100%); }
        .qa-stamp-large.QA_FAILED { background: linear-gradient(180deg, var(--qa-fail-bg-a) 0%, var(--qa-fail-bg-b) 100%); }
        .qa-stamp-large.QA_PENDING { background: linear-gradient(180deg, var(--attention-bg-a) 0%, var(--attention-bg-b) 100%); }
        /* Degraded: QA_FAILED with no machine-readable reason. Neutral, not red. */
        .qa-stamp-large.QA_FAILED.qa-degraded { background: linear-gradient(180deg, var(--qa-degraded-bg-a) 0%, var(--qa-degraded-bg-b) 100%); }
        .qa-stamp-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--ink-500); font-weight: 700; margin-bottom: 8px;
        }
        .qa-stamp-value { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
        .qa-stamp-value.QA_PASSED { color: var(--qa-pass-ink); }
        .qa-stamp-value.QA_FAILED { color: var(--qa-fail-ink); }
        .qa-stamp-value.QA_PENDING { color: var(--attention-ink); }
        .qa-stamp-value.QA_FAILED.qa-degraded { color: var(--qa-degraded-ink); }

        .qa-degraded-note {
            margin-top: 9px; font-size: 12.5px; line-height: 1.55;
            color: var(--ink-600); max-width: 62ch;
        }

        .qa-note {
            padding: 16px 22px;
            background: white;
            border-bottom: 1px solid var(--line-200);
        }
        .qa-note-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--violet-700); font-weight: 700; margin-bottom: 6px;
        }
        .qa-note-body { font-size: 13px; line-height: 1.6; color: var(--ink-800); white-space: pre-wrap; }

        .qa-section {
            background: white;
            border: 1px solid var(--line-200);
            border-radius: var(--radius-md);
            margin: 8px 22px;
            overflow: hidden;
            transition: border-color 0.15s;
        }
        .qa-section:hover { border-color: #D9DFE6; }
        .qa-section > summary {
            padding: 11px 16px; cursor: pointer; list-style: none;
            display: flex; align-items: center; gap: 12px; user-select: none;
        }
        .qa-section > summary::-webkit-details-marker { display: none; }
        .qa-section > summary::after {
            content: ""; margin-left: auto; flex-shrink: 0;
            width: 0; height: 0;
            border-left: 5px solid var(--ink-300);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform 0.15s;
        }
        .qa-section[open] > summary::after { transform: rotate(90deg); }
        .qa-section > summary:hover { background: var(--bg-50); }
        .qa-section:last-child { margin-bottom: 16px; }

        /* Seven-check rows with pills */
        .checks-list { list-style: none; padding: 4px 16px 12px 16px; margin: 0; border-top: 1px solid var(--line-100); }
        .check-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 0; font-size: 13px;
            border-bottom: 1px solid var(--line-100);
        }
        .check-row:last-child { border-bottom: 0; }
        .check-name { color: var(--ink-800); font-weight: 500; }
        .check-pill {
            font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
            padding: 3px 9px; border-radius: var(--radius-full);
            text-transform: uppercase;
        }
        .check-pill-PASS { background: var(--qa-pass-soft); color: var(--qa-pass-ink); }
        .check-pill-FAIL { background: var(--qa-fail-soft); color: var(--qa-fail-ink); }
        .check-pill-PASS_WITH_NOTE { background: var(--qa-note-soft); color: var(--qa-note-ink); }
        .check-pill-SKIPPED { background: var(--line-100); color: var(--ink-500); }

        /* ==================== AGENT 2 SKELETON ==================== */
        /* Shown immediately when Agent 1 completes; swapped out by JS when /qa returns. */
        .qa-skeleton-surface .agent-banner { position: relative; }
        .qa-running-pill {
            margin-left: auto;
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.08em; font-weight: 700;
            background: var(--violet-100); color: var(--violet-700);
            padding: 3px 9px; border-radius: var(--radius-full);
        }
        .qa-running-dot {
            width: 6px; height: 6px;
            background: var(--violet-500); border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.75); }
        }

        .qa-skeleton-stamp { background: linear-gradient(180deg, #FAFBFD 0%, #F4F6F9 100%) !important; }
        .qa-skeleton-section {
            background: white;
            border: 1px solid var(--line-200);
            border-radius: var(--radius-md);
            margin: 8px 22px 16px 22px;
            padding: 10px 16px;
        }
        .qa-skeleton-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--line-100);
        }
        .qa-skeleton-row:last-child { border-bottom: 0; }

        .skeleton-bar {
            display: block;
            height: 12px;
            background: linear-gradient(90deg, #EEF1F5 0%, #F7F9FC 50%, #EEF1F5 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.6s ease-in-out infinite;
            border-radius: 4px;
            margin-bottom: 9px;
        }
        .skeleton-bar:last-child { margin-bottom: 0; }
        .skeleton-bar-stamp { height: 32px; width: 220px; margin-top: 6px; border-radius: 6px; }
        .skeleton-bar-short { width: 62%; }
        .skeleton-bar-row-title { height: 12px; width: 200px; margin-bottom: 0; }
        .skeleton-bar-row-pill { height: 18px; width: 64px; border-radius: 999px; margin-bottom: 0; }
        @keyframes skeleton-shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ==================== AGENT 1 SKELETON ==================== */
        .agent1-skeleton-verdict {
            background: linear-gradient(180deg, #FAFBFD 0%, #F4F6F9 100%) !important;
        }
        .skeleton-bar-verdict {
            height: 38px; width: 240px;
            margin-top: 6px; margin-bottom: 14px;
            border-radius: 6px;
        }
        .skeleton-bar-confidence-num { height: 12px; width: 96px; margin-bottom: 0; }
        .skeleton-bar-confidence-track { height: 6px; flex: 0 1 180px; margin-bottom: 0; border-radius: 999px; }
        .agent1-skeleton-summary { margin-top: 14px; }
        .skeleton-bar-chip { width: 104px; height: 30px; border-radius: var(--radius-full); }
        .agent1-skeleton-row {
            background: white;
            border: 1px solid var(--line-200);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            padding: 11px 16px;
            display: flex; align-items: center; gap: 12px;
        }
        .skeleton-bar-row-title { height: 13px; width: 180px; margin-bottom: 0; }
        .skeleton-bar-row-meta { height: 11px; width: 140px; margin-bottom: 0; opacity: 0.6; }

        /* ==================== ACTIVITY LOG: HEARTBEAT + PULSING SUMMARY ==================== */
        .activity-entry.heartbeat {
            color: var(--ink-500);
            font-style: italic;
        }
        .activity-entry.heartbeat::before {
            background: var(--navy-500);
            animation: heartbeat-pulse 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.75); }
        }
        .heartbeat-counter {
            color: var(--ink-400);
            margin-left: 4px;
            font-variant-numeric: tabular-nums;
            font-style: normal;
            font-size: 11px;
        }

        /* Parse failure */
        .parse-fail {
            background: linear-gradient(180deg, #FEF2F2 0%, #FCE7E7 100%);
            border-left: 4px solid var(--red-500);
            padding: 18px 22px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
